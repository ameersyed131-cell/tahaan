<script type="text/babel" data-type="module" data-presets="react">
import React,{useState,useEffect} from "react";
import {createRoot} from "react-dom/client";
import {motion,AnimatePresence} from "framer-motion";
import {ArrowRight,Leaf,ShieldCheck,Ship,Quote,Plus,Minus,Menu,X,Mail,Phone,MapPin,Linkedin,Instagram,Facebook} from "lucide-react";

const LOGO="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/9491c35a4_TAHAAN_FOODS_PRIVATE_LIMITED__1_-removebg-preview.png";
const FOUNDER="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/1616465a7_image.png";
const GLOBAL="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/5c203f78f_generated_a46b2c9c.png";
const WAREHOUSE="https://images.pexels.com/photos/12702575/pexels-photo-12702575.jpeg?auto=compress&cs=tinysrgb&w=900";
const slides=["https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/1f4ed1d0b_generated_image.png","https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/caae424f4_generated_image.png","https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/ab5161e3d_generated_image.png"];
const SPICES="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/62329d686_1000016115_cd3bd91bf9398cd3200191f48d0f5f83-18_1_20256_01_16pm.webp";
const GRAINS="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/1156d31ed_1000016112_b42f1eec80534c26885cbc6301e8dd3e-18_1_20256_01_15pm.webp";
const PRODUCE="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/23a62f3c8_1000016116_88a3884cb16561e51786b5837cc4ec19-18_1_20256_05_38pm.webp";
const NUTS="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/8a76c331d_1000016114_75aa58aa91f7cadc0866229cce939abc-18_1_20256_01_16pm.webp";

const navLinks=[{name:"Home",href:"home.html"},{name:"About",href:"about.html"},{name:"Products",href:"products.html"},{name:"Services",href:"services.html"},{name:"Global Reach",href:"global-reach.html"},{name:"Contact",href:"contact.html"}];
const cur=(window.location.pathname.split("/").pop()||"home.html").toLowerCase();

function Navbar(){
  const [scrolled,setScrolled]=useState(false);
  const [open,setOpen]=useState(false);
  useEffect(()=>{const f=()=>setScrolled(window.scrollY>30);window.addEventListener("scroll",f);return()=>window.removeEventListener("scroll",f);},[]);
  return (
    <motion.header initial={{y:-80}} animate={{y:0}} transition={{duration:.7,ease:[.16,1,.3,1]}} className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled?"bg-white/85 backdrop-blur-xl shadow-[0_8px_40px_rgba(0,0,0,0.06)] py-3":"bg-transparent py-5"}`}>
      <nav className="max-w-7xl mx-auto px-6 flex items-center justify-between">
        <a href="home.html" className="flex items-center gap-3 group">
          <img src={LOGO} alt="Tahaan Foods logo" className="w-11 h-11 rounded-full object-cover ring-2 ring-brand-gold/40 transition-transform group-hover:rotate-12 duration-500"/>
          <div className="leading-tight"><span className="block font-heading font-semibold text-lg text-brand-greenDark">Tahaan Foods</span><span className="block text-[10px] tracking-[0.25em] text-brand-orange uppercase">Private Limited</span></div>
        </a>
        <div className="hidden lg:flex items-center gap-8">
          {navLinks.map((l)=>(<a key={l.href} href={l.href} className="relative text-sm font-medium text-neutral-700 hover:text-brand-orange transition-colors group">{l.name}<span className={`absolute -bottom-1.5 left-0 h-0.5 bg-brand-orange transition-all duration-300 ${l.href.toLowerCase()===cur?"w-full":"w-0 group-hover:w-full"}`}/></a>))}
        </div>
        <a href="contact.html" className="hidden lg:inline-flex items-center px-6 py-2.5 rounded-full bg-brand-greenDark text-white text-sm font-semibold hover:bg-brand-orange transition-colors duration-300">Get a Quote</a>
        <button onClick={()=>setOpen(!open)} className="lg:hidden text-brand-greenDark p-2">{open?<X size={26}/>:<Menu size={26}/>}</button>
      </nav>
      <AnimatePresence>{open&&(<motion.div initial={{opacity:0,height:0}} animate={{opacity:1,height:"auto"}} exit={{opacity:0,height:0}} className="lg:hidden bg-white/95 backdrop-blur-xl overflow-hidden"><div className="px-6 py-6 flex flex-col gap-4">{navLinks.map((l)=>(<a key={l.href} href={l.href} className="text-base font-medium text-neutral-800 hover:text-brand-orange">{l.name}</a>))}<a href="contact.html" className="mt-2 inline-flex justify-center px-6 py-3 rounded-full bg-brand-greenDark text-white font-semibold">Get a Quote</a></div></motion.div>)}</AnimatePresence>
    </motion.header>
  );
}

function Footer(){
  return (
    <footer className="bg-brand-greenDark text-white relative overflow-hidden">
      <div className="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-brand-orange/20 blur-3xl"/>
      <div className="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-brand-gold/20 blur-3xl"/>
      <div className="relative max-w-7xl mx-auto px-6 py-14">
        <div className="grid md:grid-cols-4 gap-10">
          <div className="md:col-span-1">
            <div className="flex items-center gap-3 mb-4"><img src={LOGO} alt="Tahaan Foods" className="w-12 h-12 rounded-full object-cover ring-2 ring-brand-gold/40"/><span className="font-heading font-semibold text-xl">Tahaan Foods</span></div>
            <p className="text-white/70 text-sm leading-relaxed">Bridging global markets with premium agricultural products through trusted import &amp; export excellence.</p>
            <div className="flex gap-3 mt-5">{[Linkedin,Instagram,Facebook].map((Icon,i)=>(<a key={i} href="#" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-brand-orange transition-colors"><Icon size={18}/></a>))}</div>
          </div>
          <div className="hidden md:block"><h4 className="font-heading text-lg mb-5 text-brand-gold">Explore</h4><ul className="space-y-3 text-sm text-white/75">{[["Home","home.html"],["About","about.html"],["Products","products.html"],["Services","services.html"],["Global Reach","global-reach.html"]].map(([n,p])=>(<li key={p}><a href={p} className="hover:text-brand-orange transition-colors">{n}</a></li>))}</ul></div>
          <div className="hidden md:block"><h4 className="font-heading text-lg mb-5 text-brand-gold">Products</h4><ul className="space-y-3 text-sm text-white/75">{["Spices & Seasonings","Rice & Grains","Fresh Produce","Nuts & Pulses","Dry Fruits"].map((n)=>(<li key={n}><a href="products.html" className="hover:text-brand-orange transition-colors">{n}</a></li>))}</ul></div>
          <div><h4 className="font-heading text-lg mb-5 text-brand-gold">Contact</h4><ul className="space-y-4 text-sm text-white/75"><li className="flex items-start gap-3"><MapPin size={18} className="text-brand-orange mt-0.5 shrink-0"/> Hyderabad, Telangana, India</li><li className="flex items-center gap-3"><Phone size={18} className="text-brand-orange shrink-0"/> +91 8121007155</li><li className="flex items-center gap-3"><Mail size={18} className="text-brand-orange shrink-0"/> info@tahanfoods.com</li></ul></div>
        </div>
        <div className="border-t border-white/10 mt-12 pt-8 flex flex-col md:flex-row justify-between gap-4 text-sm text-white/60"><p>© {new Date().getFullYear()} Tahaan Foods Private Limited. All rights reserved.</p><p>Developed by <a href="https://www.faizcodex.com" target="_blank" rel="noopener noreferrer" className="hover:text-brand-orange transition-colors">FaizCodex.com</a></p></div>
      </div>
    </footer>
  );
}

function Reveal({children,delay=0,y=40,className=""}){return <motion.div className={className} initial={{opacity:0,y}} animate={{opacity:1,y:0}} transition={{duration:.8,delay,ease:[.16,1,.3,1]}}>{children}</motion.div>;}

function Counter({value,suffix=""}){const [n,setN]=useState(0);useEffect(()=>{let raf;const s=performance.now(),d=1500;const tick=(t)=>{const p=Math.min((t-s)/d,1);setN(Math.round(value*p));if(p<1)raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);},[value]);return <>{n}{suffix}</>;}

function Hero(){
  const [idx,setIdx]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setIdx(p=>(p+1)%slides.length),5000);return()=>clearInterval(t);},[]);
  return (
    <section className="relative h-screen min-h-[640px] w-full overflow-hidden bg-brand-greenDark">
      <AnimatePresence mode="sync">
        <motion.div key={idx} initial={{opacity:0,scale:1.12}} animate={{opacity:1,scale:1}} exit={{opacity:0}} transition={{duration:1.4,ease:"easeInOut"}} className="absolute inset-0">
          <img src={slides[idx]} alt="Cargo vessel carrying containers across the ocean" className="w-full h-full object-cover"/>
        </motion.div>
      </AnimatePresence>
      <div className="absolute inset-0 bg-gradient-to-b from-brand-greenDark/70 via-brand-greenDark/45 to-brand-greenDark/85"/>
      <div className="absolute inset-0 bg-gradient-to-r from-brand-greenDark/70 to-transparent"/>
      <div className="relative h-full max-w-7xl mx-auto px-6 flex flex-col justify-center">
        <motion.h1 initial={{opacity:0,y:40}} animate={{opacity:1,y:0}} transition={{duration:1,delay:.45}} className="font-heading text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-semibold text-white mt-6 max-w-4xl leading-[1.05]">Sourcing the world's finest, delivered with <span className="text-brand-gold">trust</span></motion.h1>
        <motion.p initial={{opacity:0,y:40}} animate={{opacity:1,y:0}} transition={{duration:1,delay:.6}} className="text-white/80 text-base sm:text-lg md:text-xl mt-6 max-w-2xl leading-relaxed">Premium import &amp; export of agricultural products — sourcing any agri product from across India and the world, delivered with seamless logistics to 25+ countries.</motion.p>
        <motion.div initial={{opacity:0,y:40}} animate={{opacity:1,y:0}} transition={{duration:1,delay:.75}} className="flex flex-wrap gap-4 mt-10">
          <a href="contact.html" className="inline-flex items-center gap-2 px-8 py-4 rounded-full bg-brand-orange text-white font-semibold hover:bg-white hover:text-brand-greenDark transition-colors duration-300">Get a Quote <ArrowRight size={18}/></a>
          <a href="products.html" className="inline-flex items-center gap-2 px-8 py-4 rounded-full border border-white/40 text-white font-semibold hover:bg-white/10 transition-colors duration-300">Explore Products</a>
        </motion.div>
      </div>
      <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-2 z-10">
        {slides.map((_,i)=>(<button key={i} onClick={()=>setIdx(i)} className={`h-1.5 rounded-full transition-all duration-300 ${i===idx?"w-10 bg-brand-gold":"w-3 bg-white/40"}`}/>))}
      </div>
    </section>
  );
}

function StatsBand(){
  const stats=[{value:25,suffix:"+",label:"Countries Served"},{value:150,suffix:"+",label:"Product Varieties"},{value:15,suffix:"+",label:"Years of Trust"},{value:99,suffix:"%",label:"On-Time Delivery"}];
  return (
    <section className="relative -mt-12 z-10">
      <div className="max-w-6xl mx-auto px-6">
        <div className="bg-white rounded-3xl shadow-[0_20px_60px_rgba(15,82,40,0.12)] border border-brand-sand grid grid-cols-2 md:grid-cols-4 divide-x divide-brand-sand overflow-hidden">
          {stats.map((s,i)=>(<Reveal key={s.label} delay={i*.08} className="py-8 text-center"><div className="font-heading text-4xl md:text-5xl font-semibold text-brand-greenDark"><Counter value={s.value} suffix={s.suffix}/></div><div className="text-xs md:text-sm text-neutral-500 mt-2 tracking-wide uppercase">{s.label}</div></Reveal>))}
        </div>
      </div>
    </section>
  );
}

function Intro(){
  const points=[{icon:Leaf,title:"Farm-Fresh Sourcing",desc:"Direct partnerships with trusted growers ensure natural, wholesome quality."},{icon:ShieldCheck,title:"Certified Quality",desc:"Rigorous checks and international compliance at every stage of the chain."},{icon:Ship,title:"Seamless Logistics",desc:"Reliable end-to-end shipping across sea, air and land routes worldwide."}];
  return (
    <section className="py-24 md:py-32 max-w-7xl mx-auto px-6">
      <div className="grid lg:grid-cols-2 gap-16 items-center">
        <div>
          <Reveal><span className="text-brand-orange text-sm font-semibold tracking-[0.2em] uppercase">Who We Are</span><h2 className="font-heading text-4xl md:text-5xl font-semibold text-brand-greenDark mt-4 leading-tight">A trusted name in global food trade</h2></Reveal>
          <Reveal delay={.1}><p className="text-neutral-600 text-lg leading-relaxed mt-6">Founded by <span className="text-brand-greenDark font-semibold">Syed Ameer Hussain</span>, Tahaan Foods Private Limited has grown into a dependable partner for importers and exporters worldwide. We take pride in sourcing responsibly, packaging meticulously, and delivering consistently.</p></Reveal>
          <div className="mt-10 space-y-6">
            {points.map((p,i)=>(<Reveal key={p.title} delay={.15+i*.1}><div className="flex gap-5 group"><div className="w-12 h-12 rounded-2xl bg-brand-cream flex items-center justify-center shrink-0 group-hover:bg-brand-orange transition-colors duration-300"><p.icon className="text-brand-orange group-hover:text-white transition-colors duration-300" size={22}/></div><div><h3 className="font-heading text-xl text-brand-greenDark">{p.title}</h3><p className="text-neutral-600 mt-1">{p.desc}</p></div></div></Reveal>))}
          </div>
          <Reveal delay={.4}><a href="about.html" className="inline-flex items-center gap-2 mt-10 text-brand-greenDark font-semibold hover:text-brand-orange transition-colors">Learn our story <ArrowRight size={18}/></a></Reveal>
        </div>
        <Reveal delay={.2}>
          <motion.div whileHover={{scale:1.02}} transition={{duration:.5}} className="relative">
            <div className="absolute -inset-4 bg-gradient-to-tr from-brand-orange/20 via-brand-gold/20 to-brand-green/20 rounded-[2rem] blur-2xl"/>
            <img src={WAREHOUSE} alt="Agricultural field at sunset — Tahaan Foods sourcing" className="relative rounded-[2rem] shadow-2xl w-full object-cover aspect-[4/3]"/>
            <div className="absolute -bottom-6 -left-6 bg-white rounded-2xl shadow-xl p-6 hidden md:block"><div className="font-heading text-3xl text-gradient-brand font-semibold">15+</div><div className="text-sm text-neutral-600">Years of Trust</div></div>
          </motion.div>
        </Reveal>
      </div>
    </section>
  );
}

function Marquee(){
  const items=["Spices","Grains","Fresh Produce","Nuts","Pulses","Dry Fruits"];
  const loop=[...items,...items];
  return (
    <div className="py-8 border-y border-brand-sand bg-white overflow-hidden">
      <motion.div className="flex gap-10 w-max" animate={{x:["0%","-50%"]}} transition={{duration:22,repeat:Infinity,ease:"linear"}}>
        {loop.map((it,i)=>(<div key={i} className="flex items-center gap-3"><span className="font-heading text-2xl text-brand-greenDark">{it}</span><span className="w-2 h-2 rounded-full bg-brand-orange"/></div>))}
      </motion.div>
    </div>
  );
}

function ProductShowcase(){
  const products=[{title:"Spices & Seasonings",img:SPICES,desc:"Aromatic, hand-selected spices with bold, authentic flavour."},{title:"Rice & Grains",img:GRAINS,desc:"Premium basmati and wholesome grains, graded to perfection."},{title:"Fresh Produce",img:PRODUCE,desc:"Farm-fresh fruits and vegetables handled with care."},{title:"Nuts & Pulses",img:NUTS,desc:"Protein-rich pulses and premium nuts, sorted and packed."}];

    <section className="py-24 max-w-7xl mx-auto px-6">

          <Reveal key={p.title} delay={i*.08}>
            <a href="products.html" className="group block relative rounded-3xl overflow-hidden aspect-[3/4] shadow-lg">

              <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-6 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                <h3 className="font-heading text-2xl text-white mb-2">{p.title}</h3>
                <p className="text-white/85 text-sm leading-relaxed">{p.desc}</p>

function GlobalBand(){
  return (
    <section className="relative h-[520px] flex items-center overflow-hidden">
      <img src={GLOBAL} alt="Global shipping" className="absolute inset-0 w-full h-full object-cover"/>
      <div className="absolute inset-0 bg-brand-greenDark/70"/>
      <div className="relative z-10 max-w-7xl mx-auto px-6 text-center w-full">
        <motion.h2 initial={{opacity:0,y:40}} animate={{opacity:1,y:0}} transition={{duration:.9,ease:[.16,1,.3,1]}} className="font-heading text-4xl md:text-6xl font-semibold text-white leading-tight max-w-4xl mx-auto">From local farms to <span className="text-brand-gold italic">global tables</span></motion.h2>

        </Reveal>
      </div>

function Testimonials(){
  const items=[{quote:"Tahan Foods has been our trusted partner for premium basmati rice for over four years. Their consistency and reliability are unmatched.",name:"Ahmed Al Mansoori",role:"Procurement Head, Al Mansoori Trading LLC · UAE"},{quote:"From sourcing rare spices to seamless logistics, Tahan Foods delivered beyond our expectations every single time.",name:"Li Wei",role:"Import Director, Wei & Sons Foods · Singapore"},{quote:"Their ability to source any agri product we need, from anywhere, makes them an indispensable part of our supply chain.",name:"Sarah O'Brien",role:"Operations Manager, GreenHarvest Imports · UK"},{quote:"Professional, transparent and always on time. Tahan Foods sets the benchmark for agri export from India.",name:"David Carter",role:"Supply Chain Lead, Carter Agri Co. · USA"}];
  const [idx,setIdx]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setIdx(p=>(p+1)%items.length),5500);return()=>clearInterval(t);},[]);
  const t=items[idx];
  return (
    <section className="py-24 bg-brand-cream bg-noise">
      <div className="max-w-4xl mx-auto px-6 text-center">
        <Reveal className="mb-10"><span className="text-brand-orange text-sm font-semibold tracking-[0.2em] uppercase">Testimonials</span><h2 className="font-heading text-4xl md:text-5xl font-semibold text-brand-greenDark mt-4">Trusted by partners worldwide</h2></Reveal>
        <div className="relative min-h-[240px] flex items-center justify-center">
          <AnimatePresence mode="wait">
            <motion.div key={idx} initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-20}} transition={{duration:.5}}>
              <Quote className="text-brand-gold mx-auto mb-5" size={40}/>
              <p className="font-heading text-2xl md:text-3xl text-brand-greenDark leading-relaxed">"{t.quote}"</p>
              <div className="mt-6"><div className="font-semibold text-neutral-800">{t.name}</div><div className="text-sm text-neutral-500 mt-1">{t.role}</div></div>
            </motion.div>
          </AnimatePresence>
        </div>
        <div className="flex justify-center gap-2 mt-8">
          {items.map((_,i)=>(<button key={i} onClick={()=>setIdx(i)} className={`h-2 rounded-full transition-all duration-300 ${i===idx?"w-8 bg-brand-orange":"w-2 bg-brand-sand"}`}/>))}
        </div>
      </div>
    </section>
  );
}

  const [open,setOpen]=useState(-1);

      <div className="space-y-3">
        {faqs.map((f,i)=>(
          <div key={i} className="border border-brand-sand rounded-2xl overflow-hidden bg-white">
            <button onClick={()=>setOpen(open===i?-1:i)} className="w-full flex justify-between items-center text-left px-6 py-5 font-heading text-lg text-brand-greenDark">
              <span>{f.q}</span>{open===i?<Minus size={20} className="text-brand-orange shrink-0"/>:<Plus size={20} className="text-brand-orange shrink-0"/>}

            {open===i&&<div className="px-6 pb-5 text-neutral-600 leading-relaxed">{f.a}</div>}
          </div>
        ))}
      </div>
    </section>
  );
}
