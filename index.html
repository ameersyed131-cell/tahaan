<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/9491c35a4_TAHAAN_FOODS_PRIVATE_LIMITED__1_-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Tahaan Foods Private Limited — Premium Food Import & Export</title>
    <meta name="description" content="Tahaan Foods Private Limited, founded by Syed Ameer Hussain, delivers premium spices, grains, fresh produce and more to global markets through trusted import and export services." />
    <meta property="og:title" content="Tahaan Foods Private Limited" />
    <meta property="og:description" content="Delivering the world's finest foods through trusted global import & export." />
  </head>
  <body>
    <style>
      #app-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F5228 0%,#1B7A3D 100%);animation:lfw 4.2s forwards}
      .ll{display:flex;align-items:center;gap:24px;animation:pan 4.2s forwards}
      .lmed{width:84px;height:84px;border-radius:50%;background:#FCF6E9;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 44px rgba(0,0,0,.30);opacity:0;transform:scale(.7);animation:popin .7s .2s forwards}
      .llogo{width:72px;height:72px}
      .ltxt{display:flex;flex-direction:column;opacity:0;transform:translateX(30px);animation:slidein .5s .9s forwards}
      .lname{font-family:Georgia,'Times New Roman',serif;letter-spacing:.3em;font-size:22px;color:#fff;font-weight:700;white-space:nowrap}
      .lsub{font-family:Arial,sans-serif;letter-spacing:.35em;font-size:10px;color:#F2B93B;margin-top:6px;opacity:0;animation:fade .4s 1.25s forwards}
      @keyframes popin{to{opacity:1;transform:scale(1)}}
      @keyframes fade{to{opacity:1}}
      @keyframes slidein{to{opacity:1;transform:translateX(0)}}
      @keyframes pan{0%,52%{transform:translateX(0)}100%{transform:translateX(-34px)}}
      @keyframes lfw{0%,82%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#app-loader{animation:lfw 1.2s forwards}.ll,.lmed,.ltxt,.lsub{animation:none;opacity:1;transform:none}.lmed{transform:scale(1)}}
    </style>
    <div id="app-loader" aria-hidden="true">
      <div class="ll">
        <div class="lmed"><img class="llogo" src="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/9491c35a4_TAHAAN_FOODS_PRIVATE_LIMITED__1_-removebg-preview.png" alt="Tahaan Foods logo" /></div>
        <div class="ltxt">
          <span class="lname">TAHAAN FOODS</span>
          <span class="lsub">PRIVATE LIMITED</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>setTimeout(function(){var l=document.getElementById('app-loader');if(l&&l.parentNode)l.parentNode.removeChild(l);},4400);</script>
  </body>
</html>
