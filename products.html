<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Products — Tahaan Foods</title>
<meta name="description" content="A world of premium agri goods — spices, grains, fresh produce, nuts and pulses sourced from the regions that grow them best."/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230F5228'/><text x='50' y='62' font-size='52' text-anchor='middle' fill='%23E6A817' font-family='serif'>T</text></svg>"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{brand:{orange:'#E8720C',gold:'#E6A817',green:'#1B7A3D',greenDark:'#0F5228',cream:'#FCF6E9',sand:'#F7E9C6'}},fontFamily:{heading:['Fraunces','serif'],body:['Manrope','sans-serif']}}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
body{font-family:'Manrope',sans-serif;}
::selection{background:#E8720C;color:#fff;}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#fff}::-webkit-scrollbar-thumb{background:#E6A817;border-radius:10px}
.bg-noise{background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.04) 1px,transparent 0);background-size:22px 22px}
#app-loader{position:fixed;inset:0;background:#0F5228;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:8px;transition:opacity .5s}
#app-loader.gone{opacity:0;pointer-events:none}
.loader-logo{font-family:'Fraunces',serif;color:#fff;font-size:1.7rem;letter-spacing:.05em;animation:lp 1.6s ease-in-out infinite}
.loader-sub{color:#E6A817;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase}
@keyframes lp{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@18.2.0","react-dom/client":"https://esm.sh/react-dom@18.2.0/client","framer-motion":"https://esm.sh/framer-motion@11.16.4?deps=react@18.2.0","lucide-react":"https://esm.sh/lucide-react@0.475.0?deps=react@18.2.0"}}
</script>
</head>
<body>
<div id="app-loader"><div class="loader-logo">Tahaan Foods</div><div class="loader-sub">Private Limited</div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import React,{useState,useEffect} from "react";
import {createRoot} from "react-dom/client";
import {motion,AnimatePresence} from "framer-motion";
import {Check,ArrowRight,Menu,X,Mail,Phone,MapPin,Linkedin,Instagram,Facebook} from "lucide-react";

const LOGO="https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/9491c35a4_TAHAAN_FOODS_PRIVATE_LIMITED__1_-removebg-preview.png";
const navLinks=[{name:"Home",href:"home.html"},{name:"About",href:"about.html"},{name:"Products",href:"products.html"},{name:"Services",href:"services.html"},{name:"Global Reach",href:"global-reach.html"},{name:"Contact",href:"contact.html"}];
const cur=(window.location.pathname.split("/").pop()||"home.html").toLowerCase();

function Navbar(){
  const [scrolled,setScrolled]=useState(false);
  const [open,setOpen]=useState(false);
  useEffect(()=>{const f=()=>setScrolled(window.scrollY>30);window.addEventListener("scroll",f);return()=>window.removeEventListener("scroll",f);},[]);
  return (
    <motion.header initial={{y:-80}} animate={{y:0}} transition={{duration:.7,ease:[.16,1,.3,1]}} className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled?"bg-white/85 backdrop-blur-xl shadow-[0_8px_40px_rgba(0,0,0,0.06)] py-3":"bg-transparent py-5"}`}>
      <nav className="max-w-7xl mx-auto px-6 flex items-center justify-between">
        <a href="home.html" className="flex items-center gap-3 group">
          <img src={LOGO} alt="Tahaan Foods logo" className="w-11 h-11 rounded-full object-cover ring-2 ring-brand-gold/40 transition-transform group-hover:rotate-12 duration-500"/>
          <div className="leading-tight"><span className="block font-heading font-semibold text-lg text-brand-greenDark">Tahaan Foods</span><span className="block text-[10px] tracking-[0.25em] text-brand-orange uppercase">Private Limited</span></div>
        </a>
        <div className="hidden lg:flex items-center gap-8">
          {navLinks.map((l)=>(<a key={l.href} href={l.href} className="relative text-sm font-medium text-neutral-700 hover:text-brand-orange transition-colors group">{l.name}<span className={`absolute -bottom-1.5 left-0 h-0.5 bg-brand-orange transition-all duration-300 ${l.href.toLowerCase()===cur?"w-full":"w-0 group-hover:w-full"}`}/></a>))}
        </div>
        <a href="contact.html" className="hidden lg:inline-flex items-center px-6 py-2.5 rounded-full bg-brand-greenDark text-white text-sm font-semibold hover:bg-brand-orange transition-colors duration-300">Get a Quote</a>
        <button onClick={()=>setOpen(!open)} className="lg:hidden text-brand-greenDark p-2">{open?<X size={26}/>:<Menu size={26}/>}</button>
      </nav>
      <AnimatePresence>{open&&(<motion.div initial={{opacity:0,height:0}} animate={{opacity:1,height:"auto"}} exit={{opacity:0,height:0}} className="lg:hidden bg-white/95 backdrop-blur-xl overflow-hidden"><div className="px-6 py-6 flex flex-col gap-4">{navLinks.map((l)=>(<a key={l.href} href={l.href} className="text-base font-medium text-neutral-800 hover:text-brand-orange">{l.name}</a>))}<a href="contact.html" className="mt-2 inline-flex justify-center px-6 py-3 rounded-full bg-brand-greenDark text-white font-semibold">Get a Quote</a></div></motion.div>)}</AnimatePresence>
    </motion.header>
  );
}

function Footer(){
  return (
    <footer className="bg-brand-greenDark text-white relative overflow-hidden">
      <div className="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-brand-orange/20 blur-3xl"/>
      <div className="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-brand-gold/20 blur-3xl"/>
      <div className="relative max-w-7xl mx-auto px-6 py-14">
        <div className="grid md:grid-cols-4 gap-10">
          <div className="md:col-span-1">
            <div className="flex items-center gap-3 mb-4"><img src={LOGO} alt="Tahaan Foods" className="w-12 h-12 rounded-full object-cover ring-2 ring-brand-gold/40"/><span className="font-heading font-semibold text-xl">Tahaan Foods</span></div>
            <p className="text-white/70 text-sm leading-relaxed">Bridging global markets with premium agricultural products through trusted import &amp; export excellence.</p>
            <div className="flex gap-3 mt-5">{[Linkedin,Instagram,Facebook].map((Icon,i)=>(<a key={i} href="#" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-brand-orange transition-colors"><Icon size={18}/></a>))}</div>
          </div>
          <div className="hidden md:block"><h4 className="font-heading text-lg mb-5 text-brand-gold">Explore</h4><ul className="space-y-3 text-sm text-white/75">{[["Home","home.html"],["About","about.html"],["Products","products.html"],["Services","services.html"],["Global Reach","global-reach.html"]].map(([n,p])=>(<li key={p}><a href={p} className="hover:text-brand-orange transition-colors">{n}</a></li>))}</ul></div>
          <div className="hidden md:block"><h4 className="font-heading text-lg mb-5 text-brand-gold">Products</h4><ul className="space-y-3 text-sm text-white/75">{["Spices & Seasonings","Rice & Grains","Fresh Produce","Nuts & Pulses","Dry Fruits"].map((n)=>(<li key={n}><a href="products.html" className="hover:text-brand-orange transition-colors">{n}</a></li>))}</ul></div>
          <div><h4 className="font-heading text-lg mb-5 text-brand-gold">Contact</h4><ul className="space-y-4 text-sm text-white/75"><li className="flex items-start gap-3"><MapPin size={18} className="text-brand-orange mt-0.5 shrink-0"/> Hyderabad, Telangana, India</li><li className="flex items-center gap-3"><Phone size={18} className="text-brand-orange shrink-0"/> +91 8121007155</li><li className="flex items-center gap-3"><Mail size={18} className="text-brand-orange shrink-0"/> info@tahanfoods.com</li></ul></div>
        </div>
        <div className="border-t border-white/10 mt-12 pt-8 flex flex-col md:flex-row justify-between gap-4 text-sm text-white/60"><p>© {new Date().getFullYear()} Tahaan Foods Private Limited. All rights reserved.</p><p>Developed by <a href="https://www.faizcodex.com" target="_blank" rel="noopener noreferrer" className="hover:text-brand-orange transition-colors">FaizCodex.com</a></p></div>
      </div>
    </footer>
  );
}

function Reveal({children,delay=0,y=40,className=""}){return <motion.div className={className} initial={{opacity:0,y}} animate={{opacity:1,y:0}} transition={{duration:.8,delay,ease:[.16,1,.3,1]}}>{children}</motion.div>;}

function PageHero({eyebrow,title,subtitle}){
  return (
    <section className="relative pt-40 pb-20 md:pt-48 md:pb-28 overflow-hidden bg-brand-cream bg-noise">
      <div className="absolute top-20 right-10 w-72 h-72 bg-brand-orange/15 rounded-full blur-3xl"/>
      <div className="absolute bottom-0 left-10 w-72 h-72 bg-brand-green/15 rounded-full blur-3xl"/>
      <div className="relative max-w-5xl mx-auto px-6 text-center">
        <motion.span initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} transition={{duration:.6}} className="text-brand-orange text-sm font-semibold tracking-[0.25em] uppercase">{eyebrow}</motion.span>
        <motion.h1 initial={{opacity:0,y:30}} animate={{opacity:1,y:0}} transition={{duration:.8,delay:.1,ease:[.16,1,.3,1]}} className="font-heading text-4xl sm:text-5xl md:text-7xl font-semibold text-brand-greenDark mt-4 leading-[1.05]">{title}</motion.h1>
        {subtitle&&<motion.p initial={{opacity:0}} animate={{opacity:1}} transition={{duration:.8,delay:.3}} className="text-neutral-600 text-lg mt-6 max-w-2xl mx-auto leading-relaxed">{subtitle}</motion.p>}
      </div>
    </section>
  );
}

function ImageCarousel({images=[],interval=2200}){
  const [idx,setIdx]=useState(0);
  useEffect(()=>{if(images.length<=1)return;const t=setInterval(()=>setIdx(p=>(p+1)%images.length),interval);return()=>clearInterval(t);},[images.length,interval]);
  if(!images.length)return null;
  const cur=images[idx];
  return (
    <div className="relative w-full aspect-[4/3] rounded-[2rem] overflow-hidden shadow-2xl">
      <AnimatePresence>
        <motion.img key={idx} src={cur.src} alt={cur.label} initial={{opacity:0,scale:1.06}} animate={{opacity:1,scale:1}} exit={{opacity:0}} transition={{duration:.7,ease:"easeInOut"}} className="absolute inset-0 w-full h-full object-cover"/>
      </AnimatePresence>
      <div className="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-brand-greenDark/85 to-transparent"><span className="font-heading text-2xl text-white">{cur.label}</span></div>
      {images.length>1&&<div className="absolute top-4 right-4 flex gap-1.5">{images.map((_,i)=>(<span key={i} className={`h-1.5 rounded-full transition-all duration-300 ${i===idx?"w-6 bg-brand-gold":"w-1.5 bg-white/50"}`}/>))}</div>}
    </div>
  );
}

function ProductCarousel(){
  const items=[{title:"Spices & Seasonings",img:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/62329d686_1000016115_cd3bd91bf9398cd3200191f48d0f5f83-18_1_20256_01_16pm.webp",desc:"Aromatic, hand-selected spices sourced from the finest growing regions."},{title:"Rice & Grains",img:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/1156d31ed_1000016112_b42f1eec80534c26885cbc6301e8dd3e-18_1_20256_01_15pm.webp",desc:"Premium basmati and wholesome grains, cleaned and graded to perfection."},{title:"Fresh Produce",img:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/23a62f3c8_1000016116_88a3884cb16561e51786b5837cc4ec19-18_1_20256_05_38pm.webp",desc:"Farm-fresh fruits and vegetables handled with care from harvest to port."},{title:"Nuts & Pulses",img:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/8a76c331d_1000016114_75aa58aa91f7cadc0866229cce939abc-18_1_20256_01_16pm.webp",desc:"Protein-rich pulses and premium nuts, carefully sorted and packed."}];
  const [idx,setIdx]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setIdx(p=>(p+1)%items.length),4000);return()=>clearInterval(t);},[]);
  const item=items[idx];
  return (
    <div className="relative rounded-[2rem] overflow-hidden shadow-2xl aspect-[16/10] md:aspect-[21/9]">
      <AnimatePresence mode="wait">
        <motion.div key={idx} initial={{opacity:0,scale:1.06}} animate={{opacity:1,scale:1}} exit={{opacity:0}} transition={{duration:.8,ease:"easeInOut"}} className="absolute inset-0">
          <img src={item.img} alt={item.title} className="w-full h-full object-cover"/>
          <div className="absolute inset-0 bg-gradient-to-t from-brand-greenDark/90 via-brand-greenDark/40 to-transparent"/>
          <div className="absolute bottom-0 left-0 right-0 p-8 md:p-14"><h3 className="font-heading text-3xl md:text-5xl text-white">{item.title}</h3><p className="text-white/85 mt-3 max-w-xl">{item.desc}</p></div>
        </motion.div>
      </AnimatePresence>
      <div className="absolute top-6 right-6 flex gap-2 z-10">{items.map((_,i)=>(<button key={i} onClick={()=>setIdx(i)} className={`h-2 rounded-full transition-all duration-300 ${i===idx?"w-8 bg-brand-gold":"w-2 bg-white/50"}`}/>))}</div>
    </div>
  );
}

function Page(){
  const spicesImgs=[{src:"https://images.pexels.com/photos/33440710/pexels-photo-33440710.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Red Chilli"},{src:"https://images.pexels.com/photos/6220708/pexels-photo-6220708.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Turmeric"},{src:"https://images.pexels.com/photos/9142634/pexels-photo-9142634.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Cardamom"},{src:"https://images.pexels.com/photos/35809378/pexels-photo-35809378.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Cumin"},{src:"https://images.pexels.com/photos/10487732/pexels-photo-10487732.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Black Pepper"},{src:"https://images.pexels.com/photos/35809381/pexels-photo-35809381.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Coriander"}];
  const grainsImgs=[{src:"https://images.pexels.com/photos/31555433/pexels-photo-31555433.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Basmati Rice"},{src:"https://images.pexels.com/photos/17442637/pexels-photo-17442637.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Maize (Corn)"},{src:"https://images.pexels.com/photos/158603/pexels-photo-158603.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Wheat"},{src:"https://images.pexels.com/photos/7420513/pexels-photo-7420513.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Millets"},{src:"https://images.pexels.com/photos/11034657/pexels-photo-11034657.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Barley"},{src:"https://images.pexels.com/photos/14998444/pexels-photo-14998444.jpeg?auto=compress&cs=tinysrgb&w=800",label:"Sorghum"}];
  const produceImgs=[{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/23a62f3c8_1000016116_88a3884cb16561e51786b5837cc4ec19-18_1_20256_05_38pm.webp",label:"Tomatoes"},{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/b53edaa4a_1000016117_55a3ac67bfde2fedbd8d74707b74f815-18_1_20256_05_38pm.webp",label:"Potatoes"},{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/79b2d3330_1000016119_c6183ba9e3557d5aa6c2d54783d39497-18_1_20256_05_39pm.webp",label:"Carrots"},{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/baaf9a70b_1000016121_1c13939d2e956fdd76ba53118b40f62c-18_1_20256_07_04pm.webp",label:"Apples"},{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/3eff8c2f7_1000016122_71e0027584eb3d330af88bc3add81253-18_1_20256_07_05pm.webp",label:"Grapes"},{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/7820d798b_1000016123_455e9d42a2a957265f2403abb1be05aa-18_1_20256_07_05pm.webp",label:"Bananas"}];
  const nutsImgs=[{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/8a76c331d_1000016114_75aa58aa91f7cadc0866229cce939abc-18_1_20256_01_16pm.webp",label:"Split Red Lentils"},{src:"https://media.base44.com/images/public/6a4e5de5f7403fbafbc3fde5/ed8e81db0_1000016120_57a9937d75f5299647ac2c9af65070e9-18_1_20256_05_39pm.webp",label:"Peanuts"}];
  const categories=[{title:"Spices & Seasonings",images:spicesImgs,desc:"India's spice heritage is the backbone of our trade. We source vibrant, aromatic spices from the regions that grow them best — red chillies from the Deccan, cardamom from the Western Ghats, turmeric from the south — and deliver them to kitchens and manufacturers worldwide. Every consignment is selected for colour, potency and purity.",items:["Red Chilli","Turmeric","Cardamom","Cumin","Black Pepper","Coriander"]},{title:"Rice & Grains",images:grainsImgs,desc:"From prized basmati to wholesome maize and millets, our grains are cleaned, graded and packed to meet the exacting standards of international buyers. We work closely with millers and growers to ensure consistent quality across shipments, season after season.",items:["Basmati Rice","Maize (Corn)","Wheat","Millets","Barley","Sorghum"]},{title:"Fresh Produce",images:produceImgs,desc:"We move farm-fresh fruits and vegetables from harvest to port with the care perishables demand. Our produce is handled to preserve freshness, appearance and shelf life, giving overseas buyers confidence in every container that arrives.",items:["Tomatoes","Potatoes","Onions","Carrots","Apples","Grapes","Bananas","Mangoes"]},{title:"Nuts & Pulses",images:nutsImgs,desc:"Protein-rich pulses and premium nuts form a growing part of global demand. We sort, grade and pack lentils, chickpeas, peanuts and more to specification — a dependable source of nutrition for markets around the world.",items:["Split Red Lentils","Cashews","Peanuts","Chickpeas","Kidney Beans","Almonds"]}];
  return (
    <>
      <Navbar/>
      <PageHero eyebrow="Our Products" title="A world of premium agri goods" subtitle="From vibrant spices to wholesome grains, we trade in agricultural quality that speaks for itself — sourced from the regions that grow it best and shipped to wherever it's needed."/>
      <section className="py-16 max-w-4xl mx-auto px-6">
        <Reveal>
          <h2 className="font-heading text-3xl md:text-4xl font-semibold text-brand-greenDark mb-6">What we trade in</h2>
          <p className="text-neutral-600 text-lg leading-relaxed">Tahaan Foods trades exclusively in agricultural products — the grains, spices, produce, pulses and nuts that feed the world. Our catalogue spans the categories below, but it does not end there. Because we are fundamentally a sourcing business, if a partner needs an agri product we do not list, we will find it, source it and deliver it. Think of these categories as a starting point, not a boundary.</p>
          <p className="text-neutral-600 text-lg leading-relaxed mt-4">Every product we move is chosen with the end market in mind — the right variety, the right grade, the right packaging. It is this attention to detail that turns a shipment into a long-term relationship.</p>
        </Reveal>
      </section>
      <section className="pb-8 max-w-7xl mx-auto px-6"><Reveal><ProductCarousel/></Reveal></section>
      <section className="py-16 max-w-7xl mx-auto px-6 space-y-24">
        {categories.map((p,i)=>(
          <Reveal key={p.title}>
            <div className={`grid lg:grid-cols-2 gap-14 items-center ${i%2===1?"lg:[direction:rtl]":""}`}>
              <ImageCarousel images={p.images}/>
              <div className="[direction:ltr]">
                <h2 className="font-heading text-3xl md:text-4xl font-semibold text-brand-greenDark">{p.title}</h2>
                <p className="text-neutral-600 text-lg mt-4 leading-relaxed">{p.desc}</p>
                <div className="grid grid-cols-2 gap-3 mt-8">
                  {p.items.map((it)=>(<div key={it} className="flex items-center gap-2 text-neutral-700"><span className="w-6 h-6 rounded-full bg-brand-green/10 flex items-center justify-center shrink-0"><Check size={14} className="text-brand-green"/></span>{it}</div>))}
                </div>
              </div>
            </div>
          </Reveal>
        ))}
      </section>
      <section className="py-20 max-w-4xl mx-auto px-6 text-center">
        <Reveal>
          <h2 className="font-heading text-3xl md:text-4xl font-semibold text-brand-greenDark mb-5">Don't see what you need?</h2>
          <p className="text-neutral-600 text-lg leading-relaxed">Our catalogue is a starting point, not a limit. If you need an agricultural product we haven't listed — from any part of India or anywhere in the world — tell us what you're looking for. We'll source it, move it and deliver it to your specification.</p>
          <a href="contact.html" className="inline-flex items-center gap-2 mt-8 px-8 py-4 rounded-full bg-brand-orange text-white font-semibold hover:bg-brand-greenDark transition-colors duration-300">Tell us your requirement <ArrowRight size={18}/></a>
        </Reveal>
      </section>
      <Footer/>
    </>
  );
}

createRoot(document.getElementById("root")).render(<Page/>);
setTimeout(()=>{var l=document.getElementById('app-loader');if(l)l.classList.add('gone');},1200);
</script>
</body>
</html>
